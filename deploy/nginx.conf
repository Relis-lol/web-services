# Saveroq Studio — nginx-Konfiguration
#
# Die Seite ist rein statisch. Nginx muss hier nur ausliefern, komprimieren
# und die Sicherheits-Header setzen, die auf GitHub Pages nicht moeglich waren.
#
# Gelauscht wird auf 8080, nicht auf 80: Das Image laeuft als unprivilegierter
# Nutzer (uid 101) und darf keine Ports unter 1024 binden. Nach aussen ist der
# Port ohnehin nicht sichtbar — der Cloudflare-Tunnel spricht ihn ueber das
# interne Docker-Netz an.
#
# WICHTIG — nginx-Falle:
# `add_header` wird NICHT vererbt, sobald ein location-Block eigene Header
# setzt. Wuerde die Cache-Steuerung ueber `add_header` in location-Bloecken
# laufen, fielen dort saemtliche Sicherheits-Header lautlos weg. Deshalb wird
# der Cache-Wert unten per `map` aus der URL abgeleitet und alles zusammen
# EINMAL auf Server-Ebene gesetzt.

# ---------------------------------------------------------------------------
# Echte Client-IP
#
# Der Weg ist Cloudflare -> cloudflared -> nginx. Aus Sicht von nginx ist der
# Absender IMMER der Tunnel-Container, nie der Besucher. Die echte Adresse
# steht in `CF-Connecting-IP`, gesetzt von Cloudflare.
#
# Dieser Header wird NUR von Absendern aus privaten Docker-Netzen uebernommen.
# Das ist hier ausreichend sicher, weil der Container keinen veroeffentlichten
# Host-Port hat: Es gibt keinen Weg, ihn an Cloudflare vorbei zu erreichen.
# Waere je ein Port freigegeben, muesste diese Liste sofort enger werden.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    CF-Connecting-IP;
real_ip_recursive off;

# Grobe Vorbegrenzung fuer das Kontaktformular. Die eigentliche, feinere
# Begrenzung macht das Backend — dieser Riegel haelt schon vorher Fluten ab,
# damit sie den Dienst gar nicht erst erreichen.
limit_req_zone $binary_remote_addr zone=kontakt:1m rate=6r/m;

# Cache-Dauer aus der Dateiendung ableiten.
# Die Asset-Namen tragen keine Pruefsumme (styles.css, main.js) — lange
# Cache-Zeiten wuerden Aktualisierungen deshalb verschlucken.
map $uri $saveroq_cache_control {
    default                      "no-cache";
    ~*\.(?:css|js)$              "public, max-age=600";
    ~*\.(?:webp|png|jpe?g|svg|ico|woff2?)$  "public, max-age=604800";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    # ---- Sicherheits-Header ------------------------------------------------
    # Content-Security-Policy: Die Seite laedt ausschliesslich eigene Dateien.
    # Keine externen Schriften, kein CDN, kein Tracker — deshalb reicht 'self'
    # ueberall. Inline-Skripte und Inline-Styles gibt es bewusst keine.
    #
    # ACHTUNG beim Kontaktformular: Sobald CONTACT_FORM_ENDPOINT in
    # js/config.js gesetzt wird, muss dessen Origin hier in `connect-src`
    # ergaenzt werden — sonst blockt der Browser das Absenden.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # TLS liefert Cloudflare. Der Header wird durchgereicht und gilt nur fuer
    # diesen Hostnamen. Bewusst ohne includeSubDomains und ohne preload.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $saveroq_cache_control always;

    # ---- Kompression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # ---- Routen ------------------------------------------------------------
    # Fuer den Docker-Healthcheck. Kein Zugriffslog, damit er die Logs nicht flutet.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Kontakt-Endpunkt ---------------------------------------------
    location = /api/contact {
        limit_req             zone=kontakt burst=3 nodelay;
        limit_req_status      429;
        client_max_body_size  16k;
        client_body_timeout   10s;

        # Aufloesung zur LAUFZEIT statt beim Start.
        #
        # Stuende hier `proxy_pass http://api:8000/...`, wuerde nginx den
        # Namen einmal beim Laden aufloesen. Zwei Folgen: Der Start scheitert,
        # solange das Backend noch nicht existiert — und nach einem Neubau des
        # Backends zeigt nginx weiter auf die alte, tote Container-IP (genau
        # der 502-Klassiker im eve-Stack auf demselben Host).
        #
        # Mit einer Variablen im Ziel fragt nginx den Docker-DNS bei jeder
        # Anfrage neu. Beides erledigt.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $backend       "api:8000";
        proxy_pass         http://$backend/api/contact;
        proxy_http_version 1.1;

        # $remote_addr ist dank realip oben bereits die echte Adresse des
        # Besuchers. Das Backend vertraut ausschliesslich diesem Header —
        # CF-Connecting-IP liest es bewusst nicht selbst.
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Request-Id $request_id;
        # Nicht weiterreichen: Sonst koennte ein Absender den Wert
        # vortaeuschen, falls der Dienst je direkt erreichbar waere.
        proxy_set_header   CF-Connecting-IP "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Fehlerseiten des Backends unveraendert durchreichen; nur wenn das
        # Backend gar nicht antwortet, greift die eigene JSON-Antwort unten.
        proxy_intercept_errors off;
    }

    # Antworten in JSON, damit das Formular sie auswerten kann. Eine
    # HTML-Fehlerseite waere fuer den Browser nur unlesbarer Text.
    error_page 429 = @zu_viele;
    location @zu_viele {
        internal;
        default_type application/json;
        return 429 '{"ok":false,"error":"rate_limited"}';
    }

    error_page 502 503 504 = @nicht_erreichbar;
    location @nicht_erreichbar {
        internal;
        default_type application/json;
        return 503 '{"ok":false,"error":"service_unavailable"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
