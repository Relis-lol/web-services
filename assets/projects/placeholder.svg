<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Platzhalter fuer einen Projekt-Screenshot">
  <!-- Platzhaltergrafik fuer Projekt-Screenshots (Seitenverhaeltnis 16:10).
       TODO: Durch echte Screenshots ersetzen und in js/projects.js
             den Pfad, die Breite und die Hoehe anpassen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#e5e9ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8dee6" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.55"/>

  <!-- angedeutetes Browserfenster -->
  <rect x="200" y="180" width="1200" height="640" rx="18" fill="#ffffff" stroke="#d3dae2" stroke-width="2"/>
  <path d="M200 240h1200" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="240" cy="210" r="8" fill="#dbe1e8"/>
  <circle cx="268" cy="210" r="8" fill="#dbe1e8"/>
  <circle cx="296" cy="210" r="8" fill="#dbe1e8"/>
  <rect x="330" y="200" width="360" height="20" rx="10" fill="#eef1f5"/>

  <rect x="256" y="300" width="420" height="26" rx="8" fill="#e7ebf0"/>
  <rect x="256" y="348" width="620" height="16" rx="8" fill="#eef1f5"/>
  <rect x="256" y="380" width="520" height="16" rx="8" fill="#eef1f5"/>
  <rect x="256" y="440" width="170" height="42" rx="21" fill="#dfe5ec"/>

  <rect x="256" y="540" width="340" height="220" rx="14" fill="#f2f5f8" stroke="#e3e8ee" stroke-width="2"/>
  <rect x="630" y="540" width="340" height="220" rx="14" fill="#f2f5f8" stroke="#e3e8ee" stroke-width="2"/>
  <rect x="1004" y="540" width="340" height="220" rx="14" fill="#f2f5f8" stroke="#e3e8ee" stroke-width="2"/>

  <text x="800" y="900" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#8b97a5"
        letter-spacing="2">SCREENSHOT FOLGT</text>
</svg>
